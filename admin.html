<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blitz Session Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11151b;color:#e9edf2;font:14px Arial,sans-serif}main{max-width:1200px;margin:0 auto;padding:20px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card{background:#1c222b;border-radius:8px;padding:12px 16px}.stat{font-size:26px;font-weight:bold}.muted{color:#8993a1;font-size:12px}input,button{background:#252d38;color:#fff;border:1px solid #3a4553;border-radius:6px;padding:9px 11px}input{min-width:360px}button{cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:16px;background:#181e26}th,td{padding:8px 10px;border-bottom:1px solid #2a333f;text-align:left;white-space:nowrap}th{color:#aeb8c5}#err{color:#ff8d8d;margin-top:12px;white-space:pre-wrap}.groups{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.groups .card{min-width:220px}pre{margin:6px 0 0;white-space:pre-wrap}@media(max-width:700px){input{min-width:100%;width:100%}.tablewrap{overflow:auto}}
</style>
</head>
<body>
<main>
<h2>Blitz Session Admin</h2>
<div class="top">
<input id="token" type="password" placeholder="ADMIN_TOKEN">
<button id="load">Загрузить</button>
<button id="forget">Забыть токен</button>
</div>
<div id="err"></div>
<div id="summary" class="groups"></div>
<div id="groups" class="groups"></div>
<div class="tablewrap"><table id="users" hidden><thead><tr><th>Nickname</th><th>Account ID</th><th>Realm</th><th>Platform</th><th>Distribution</th><th>Version</th><th>First seen</th><th>Last seen</th><th>Requests</th></tr></thead><tbody></tbody></table></div>
</main>
<script src="config.js?v=obs011"></script>
<script>
(function(){
var api=String(window.BLITZ_SESSION_API||"").replace(/\/+$/,"");var ti=document.getElementById("token"),err=document.getElementById("err"),sum=document.getElementById("summary"),groups=document.getElementById("groups"),table=document.getElementById("users"),body=table.querySelector("tbody");
try{ti.value=sessionStorage.getItem("blitz-admin-token")||""}catch(e){}
function dt(v){if(!v)return"-";try{return new Date(Number(v)).toLocaleString()}catch(e){return String(v)}}
function esc(v){return String(v==null?"":v).replace(/[&<>\"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;"}[c]})}
function card(label,value){return'<div class="card"><div class="stat">'+esc(value)+'</div><div class="muted">'+esc(label)+'</div></div>'}
function group(title,arr,key){var lines=(arr||[]).map(function(x){return x[key]+": "+x.users+" users / "+x.requests+" req"}).join("\n")||"-";return'<div class="card"><b>'+esc(title)+'</b><pre>'+esc(lines)+'</pre></div>'}
function load(){var token=ti.value.trim();err.textContent="";if(!token){err.textContent="Нужен ADMIN_TOKEN";return}try{sessionStorage.setItem("blitz-admin-token",token)}catch(e){}var x=new XMLHttpRequest();x.onreadystatechange=function(){if(x.readyState!==4)return;if(x.status<200||x.status>=300){err.textContent="HTTP "+x.status+"\n"+x.responseText;return}var d;try{d=JSON.parse(x.responseText)}catch(e){err.textContent="JSON parse error";return}sum.innerHTML=card("Всего пользователей",d.summary.total_users)+card("Активны 24ч",d.summary.active_24h)+card("Активны 7д",d.summary.active_7d);groups.innerHTML=group("Platforms",d.platforms,"platform")+group("Distributions",d.distributions,"distribution")+group("Versions",d.versions,"mod_version");body.innerHTML="";(d.users||[]).forEach(function(u){var tr=document.createElement("tr");tr.innerHTML='<td>'+esc(u.nickname)+'</td><td>'+esc(u.account_id)+'</td><td>'+esc(u.realm)+'</td><td>'+esc(u.platforms)+'</td><td>'+esc(u.distributions)+'</td><td>'+esc(u.versions)+'</td><td>'+esc(dt(u.first_seen))+'</td><td>'+esc(dt(u.last_seen))+'</td><td>'+esc(u.requests)+'</td>';body.appendChild(tr)});table.hidden=false};x.open("GET",api+"/admin/stats?_ts="+Date.now(),true);x.setRequestHeader("Authorization","Bearer "+token);x.send(null)}
document.getElementById("load").onclick=load;document.getElementById("forget").onclick=function(){ti.value="";try{sessionStorage.removeItem("blitz-admin-token")}catch(e){}};if(ti.value)load();
})();
</script>
</body></html>
