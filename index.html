<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blitz Session Widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="summaryView" class="summary-view">
    <section class="summary">
      <div class="stat">
        <strong id="sessionBattles">0</strong>
        <span>BATTLES</span>
      </div>
      <div class="stat">
        <strong id="sessionWinRate">0.00%</strong>
        <span>WIN RATE</span>
      </div>
      <div class="stat">
        <strong id="sessionAvgDamage">0</strong>
        <span>AVG. DAMAGE</span>
      </div>
    </section>
    <button id="resetButton" class="reset" type="button" title="Сбросить сессию">✕</button>
    <div id="summaryError" class="error-line"></div>
  </main>

  <main id="tanksView" class="tanks-view">
    <div id="tankList" class="tank-list">
      <div class="empty">Пока нет боёв после точки отсчёта.</div>
    </div>
    <div id="tanksError" class="error-line"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
