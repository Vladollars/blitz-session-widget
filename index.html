<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blitz Session Test</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      color: #f2f2f2;
      overflow: hidden;
    }

    * { box-sizing: border-box; }

    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .panel {
      width: 100%;
      max-width: 520px;
      background: rgba(18, 22, 28, 0.88);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.28);
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.4px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      padding: 8px 6px;
      text-align: center;
    }

    .value {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.1;
    }

    .label {
      margin-top: 4px;
      font-size: 10px;
      color: rgba(255,255,255,0.62);
      text-transform: uppercase;
    }

    .debug {
      margin-top: 8px;
      font-size: 10px;
      color: rgba(255,255,255,0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    body.compact .panel {
      max-width: none;
      padding: 4px 8px;
      border-radius: 4px;
    }

    body.compact .title,
    body.compact .debug {
      display: none;
    }

    body.compact .stats {
      gap: 4px;
    }

    body.compact .stat {
      padding: 3px 4px;
      background: rgba(0,0,0,0.28);
    }

    body.compact .value {
      font-size: 16px;
    }

    body.compact .label {
      font-size: 8px;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="title">Blitz Session Test</div>

      <div class="stats">
        <div class="stat">
          <div class="value">4384</div>
          <div class="label">Battles</div>
        </div>

        <div class="stat">
          <div class="value">70.89%</div>
          <div class="label">Win Rate</div>
        </div>

        <div class="stat">
          <div class="value">3083</div>
          <div class="label">Avg. Damage</div>
        </div>
      </div>

      <div class="debug" id="debug">Waiting for URL params...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const ui = params.get("ui") || "unknown";
    const accountId = params.get("account_id") || "not-provided";
    const realm = params.get("realm") || "not-provided";

    if (ui === "hangar-compact" || ui === "battle") {
      document.body.classList.add("compact");
    }

    document.getElementById("debug").textContent =
      `ui=${ui} | account_id=${accountId} | realm=${realm}`;
  </script>
</body>
</html>
