<!doctype html>
<html lang="ru" data-ui="summary">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blitz Session Summary</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main class="summary-view">
    <section class="summary">
      <div class="stat">
        <strong id="sessionBattles">0</strong>
        <span>BATTLES</span>
      </div>
      <div class="stat">
        <strong id="sessionWinRate">0.00%</strong>
        <span>WIN RATE</span>
      </div>
      <div class="stat">
        <strong id="sessionAvgDamage">0</strong>
        <span>AVG. DAMAGE</span>
      </div>
    </section>
    <button id="resetButton" class="reset" type="button" title="Сбросить сессию">✕</button>
    <div id="errorLine" class="error-line"></div>
  </main>
  <script src="script.js?v=3"></script>
</body>
</html>
